; =============================================================================
; Hardened php.ini for allowski/php-image (PHP 8.2, Apache mod_php)
; Installed as $PHP_INI_DIR/php.ini. Files in $PHP_INI_DIR/conf.d/*.ini are
; parsed AFTER this file, so a downstream image can override any single
; directive by dropping its own file there (e.g. conf.d/zz-app.ini).
; Directives not listed here keep PHP's built-in defaults.
; =============================================================================

[PHP]
engine = On
short_open_tag = Off
precision = 14
serialize_precision = -1
output_buffering = 4096
implicit_flush = Off
zend.enable_gc = On
; Never put function arguments (passwords, tokens...) into stack traces / logs.
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
; Production: assertions compiled out.
zend.assertions = -1

; --- Information disclosure ---------------------------------------------------
; No "X-Powered-By: PHP/x.y" header and no easter-egg URLs.
expose_php = Off
; Errors go to the log (Apache error log -> container stderr), never to the client.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
ignore_repeated_errors = Off
report_memleaks = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; No "X-PHP-Originating-Script" header on outgoing mail.
mail.add_x_header = Off

; --- Code execution surface ---------------------------------------------------
; No runtime loading of extensions.
enable_dl = Off
; Remote file inclusion is never allowed. allow_url_fopen stays On because
; Composer and most HTTP client fallbacks need it; outbound access should be
; restricted at the network level instead.
allow_url_fopen = On
allow_url_include = Off
; Shell / disclosure helpers that nothing in this image needs. exec() and
; proc_open() are deliberately kept: snappdf (Chrome), Laravel's Process
; facade, Symfony Console and Composer all rely on proc_open().
disable_functions = passthru,shell_exec,system,popen,pcntl_exec,show_source,highlight_file
; Not used by mod_php but keeps the setting safe if PHP is ever run as CGI/FPM.
cgi.fix_pathinfo = 0
cgi.force_redirect = 1

; --- Resource limits (DoS mitigation) -----------------------------------------
max_execution_time = 60
max_input_time = 60
; Caps the number of GET/POST/COOKIE variables parsed (hash-collision DoS).
max_input_vars = 1000
max_input_nesting_level = 64
memory_limit = 256M
default_socket_timeout = 60

; --- Request handling -----------------------------------------------------------
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
default_charset = "UTF-8"
default_mimetype = "text/html"

; --- File uploads ---------------------------------------------------------------
file_uploads = On
; Hard limit of 40 MiB per uploaded file and per request body. post_max_size
; caps the whole POST payload, so it is the effective ceiling for uploads.
; Apache enforces the same ceiling via LimitRequestBody (see config/apache).
upload_max_filesize = 40M
post_max_size = 40M
max_file_uploads = 10
; upload_tmp_dir is left at the system default (/tmp).

[Date]
date.timezone = UTC

[Session]
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.cookie_lifetime = 0
; Set session.cookie_secure = 1 in a conf.d override once the app is only
; served over HTTPS (it would break plain-HTTP local development here).
session.cookie_secure = 0
session.name = PHPSESSID
session.sid_length = 48
session.sid_bits_per_character = 6
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.cache_limiter = nocache
session.cache_expire = 180
session.lazy_write = 1
; Upload progress tracking writes attacker-controlled data into the session
; file (a known LFI -> RCE primitive) and is not needed by the apps on this
; image.
session.upload_progress.enabled = Off
session.upload_progress.cleanup = On

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Default: 1 (check file mtime every revalidate_freq seconds). Set to 0 in a
; conf.d override for immutable production deploys.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

[xdebug]
; Xdebug is installed for development but disabled by default: its remote
; debugger / profiler must never be reachable in production. Turn it on at
; run time with an environment variable, e.g. XDEBUG_MODE=debug,develop
; (the env var takes precedence over this file).
xdebug.mode = "off"
xdebug.start_with_request = no

[mysqlnd]
mysqlnd.collect_memory_statistics = Off

[ldap]
ldap.max_links = -1
