# Apache hardening for allowski/php-image. Enabled with `a2enconf hardening`.
# ServerTokens / ServerSignature are set in security.conf by the Dockerfile.

# Disable HTTP TRACE (cross-site tracing).
TraceEnable Off

# Cap request bodies at 20 MiB, matching PHP's upload_max_filesize /
# post_max_size, so oversized uploads are rejected before PHP buffers them.
LimitRequestBody 20971520

# Slow-request (Slowloris) mitigation.
Timeout 60
<IfModule reqtimeout_module>
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</IfModule>

# Never serve dotfiles or dot-directories (.env, .git, .htpasswd, ...),
# with an exception for ACME / .well-known.
<DirectoryMatch "/\.(?!well-known)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>

# Block direct requests to files that must never be downloadable.
<FilesMatch "(?i)\.(env|ini|log|sh|sql|bak|orig|swp|yml|yaml|lock|phar)$">
    Require all denied
</FilesMatch>
<FilesMatch "(?i)^(composer\.json|package\.json|artisan|dockerfile)$">
    Require all denied
</FilesMatch>

# No directory listings anywhere a document root may live.
<Directory /var/www>
    Options -Indexes
</Directory>
<Directory /app>
    Options -Indexes
</Directory>

<IfModule mod_headers.c>
    # Stop browsers from MIME-sniffing responses into executable types.
    Header always set X-Content-Type-Options "nosniff"
    # Strip server-side tech hints from responses.
    Header always unset X-Powered-By
</IfModule>
